name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,all]"
      - run: pytest -q
      - run: python tools/check_sandbox.py
      - name: The tag matches the version in the package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import she; print(she.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match she.__version__ $version" >&2
            exit 1
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/she-lang/
    permissions:
      id-token: write        # trusted publishing — no API token stored anywhere
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Draft the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
